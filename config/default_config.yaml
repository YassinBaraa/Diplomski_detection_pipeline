# Detection Pipeline Configuration

# Source Configuration
source:
  type: "dsj"  # "dsj", "mp4", "camera", or "nicla"
  video_path: "sources/example.mp4"  # Path to video file
  nicla_serial_port: "/dev/ttyACM0"
  nicla_baudrate: 115200
  nicla_boot_delay_sec: 3

# Detector Configuration
detector:
  type: "hailo_seg"  # "yolo_seg" or "hailo_seg"
  model_path: "model/yolov8_segmentation.hef"
  confidence_threshold: 0.25   # low on purpose: the tracker (tracking.*) decides what counts

# Camera Configuration (if source type is "camera", i.e. Pi camera via picamera2)
camera:
  resolution_width: 1280
  resolution_height: 720
  format: "RGB888"

# DSJ-3079-HE USB camera (if source type is "dsj") -- standard UVC device,
# resolved by udev by-id path (see sources/DSJSource.py); device/width/height/fps
# below are only used if that resolution fails and it falls back to an index.
dsj:
  device_fallback: 0
  resolution_width: 1280
  resolution_height: 720
  fps: 30

# Post-Processing: Mask Extraction
mask_extraction:
  bitmask_threshold: 0.5

# Post-Processing: Candidate Scoring
candidate_scoring:
  # Geometric scoring weights
  w_boundary: 1.0
  w_junction: 0.3
  w_endpoint: 0.2

  # Geometric thresholds
  min_distance_to_boundary: 0.5
  junction_neighbor_threshold: 3

  # Track bonus weights
  w_track_age: 0.05
  w_hit_streak: 0.1
  w_conf: 0.2
  w_consistency: 0.1

  # Temporal stability
  min_confirm_frames: 3
  stability_buffer_size: 10
  stability_threshold: 5
  spatial_cluster_radius: 15
  track_cleanup_frames: 30

# Visualization
visualization:
  enabled: true
  resize_width: 640
  resize_height: 384
  display_window_name: "Detection Pipeline"

# Tracking: ByteTrack hysteresis + Kalman coasting (used by main.py and test_record.py)
tracking:
  track_activation_threshold: 0.5   # min conf to START a track (lower-conf dets only keep one alive)
  lost_track_buffer: 30
  minimum_consecutive_frames: 1
  coast_frames: 0                   # Kalman-coast lost tracks this many frames (0 = off, implementation kept in trackers/TrackCoaster.py)

# test_record.py: run the .pt model over recorded videos and save annotated output
# (detector confidence and tracking settings come from the sections above)
test_record:
  video_dir: "/home/baraa/Desktop/Paper_1/recordings"  # every *.mp4 in here is processed
  model_path: "model/best_small.pt"
  stages: [5]                 # 1=mask 2=heatmap 3=skeleton 4=candidates 5=full pipeline overlay
  output_dir: "detection_test"
